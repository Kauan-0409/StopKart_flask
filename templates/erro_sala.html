<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sala não encontrada</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            background: #0d0e11;

            color: white;

            font-family: "Inter", sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: min(850px, 90%);

            background: #15161a;

            border: 1px solid #292b31;

            border-radius: 18px;

            padding: 35px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0,0,0,.35);

        }


        .imagem {

            width: 100%;

            max-height: 560px;

            object-fit: cover;

            border-radius: 12px;

            display: block;

        }


        h1 {

            font-size: 34px;

            margin: 28px 0 10px;

        }


        h1 span {

            color: #ff5555;

        }


        p {

            color: #999;

            font-size: 16px;

            line-height: 1.6;

        }


        .botao {

            display: inline-block;

            margin-top: 18px;

            padding: 13px 22px;

            border-radius: 10px;

            border: 1px solid #303239;

            background: #202228;

            color: white;

            text-decoration: none;

            font-weight: 700;

            transition: .2s;

        }


        .botao:hover {

            background: #2b2e35;

            transform: translateY(-2px);

        }

    </style>

</head>


<body>

    <div class="container">

        <img
            class="imagem"
            src="{{ url_for('static', filename='erro-sala.png') }}"
        >


        <h1>
            sala <span>não</span> encontrada
        </h1>


        <p>

            esse código não existe<br>

            ou a sala já foi encerrada.

        </p>


        <a
            href="/"
            class="botao"
        >
            ← voltar para o início
        </a>

    </div>

</body>

</html>
